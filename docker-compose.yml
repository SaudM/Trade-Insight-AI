services:
  # PostgreSQL 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: trade-insight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trade_insight_ai
      POSTGRES_USER: trade_user
      # 从环境变量读取，勿在仓库写明文；本地默认值仅供开发
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade_password_2024}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # 仅本机可达，避免公网暴露数据库
      - "127.0.0.1:15432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - trade-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U trade_user -d trade_insight_ai" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存服务（可选，用于会话和缓存）
  redis:
    image: redis:7-alpine
    container_name: trade-insight-redis
    restart: unless-stopped
    ports:
      # 仅本机可达
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - trade-network
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js 应用服务
  # 所有密钥从 .env 读取（env_file），切勿在本文件内写明文。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: trade-insight-app:latest
    container_name: trade-insight-app
    restart: unless-stopped
    ports:
      # 仅绑本机，必须置于 caddy/反向代理之后，禁止 0.0.0.0 公网裸露
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    # 安全加固：禁止提权、丢弃所有 capability、只读根文件系统 + 可写缓存用 tmpfs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - trade-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  trade-network:
    driver: bridge
